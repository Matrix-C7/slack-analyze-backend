# Backend on Render's free web service.
# Order: MongoDB Atlas free cluster first, then the Google Drive refresh token (npm run gdrive:auth),
# then this service, then the frontend on Vercel.
# Secrets with sync:false are filled in the Render dashboard (they are not in git).
services:
  - type: web
    name: slack-analyze-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: slack_analyze
      - key: INGEST_API_KEY
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: TRUST_PROXY
        value: "true"
      - key: FILE_STORAGE
        value: gdrive
      - key: FILE_STORAGE_DIR
        value: /tmp/slack-files
      - key: FILE_MAX_MB
        value: "100"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_NAME
        value: Slack Analyze files
